# ==============================================================================
# SIH26191 — Capacity Planning Standard Configuration
# Step 10 — Preliminary Spatial Capacity Estimate
# ==============================================================================
#
# STATUS: CONFIGURED (Phase D — 2026-08-30)
#
# PLANNING STANDARD APPLIED:
# Pradhan Mantri Awaas Yojana — Gramin (PMAY-G)
# Ministry of Rural Development, Government of India
# Minimum house size: 25 m² per household (including dedicated cooking area)
#
# This is a PRELIMINARY PLANNING SCENARIO only.
# Engineering surveys, geotechnical assessment, and legal clearances are
# required before any site is used for actual relocation.
#
# When updating, re-run:
#   python processing/capacity/build_candidate_context.py
# ==============================================================================

capacity_version: "1.1"
status: "CONFIGURED"

configuration_note: >-
  Planning standard configured using the Pradhan Mantri Awaas Yojana — Gramin
  (PMAY-G) minimum house size norm of 25 m² per household. This is an
  officially gazetted GoI scheme standard and represents the most widely
  applicable government norm for rural housing in India. The estimate is
  a PRELIMINARY PLANNING SCENARIO only — not engineering-certified capacity.
  Actual usable area per household at a relocation site will depend on
  setbacks, road rights-of-way, common facilities, and slope constraints.
  All outputs are labelled as "Preliminary Spatial Capacity Estimate."

# ── Planning Standard ─────────────────────────────────────────────────────
planning_standard:
  authority: "Ministry of Rural Development (MoRD), Government of India"
  scheme: "Pradhan Mantri Awaas Yojana — Gramin (PMAY-G)"
  document: "PMAY-G Operational Guidelines — Technical Specifications"
  section: "Minimum house size: 25 sq. m. (built area including cooking space)"
  year: 2016
  # Official scheme notification and guidelines available at:
  url: "https://pmayg.nic.in/"
  citation: >-
    Ministry of Rural Development, GoI. Pradhan Mantri Awaas Yojana — Gramin
    (PMAY-G) Operational Guidelines (2016). Technical Specification:
    Minimum house size of 25 square metres per household (including a dedicated
    area for hygienic cooking). An upgrade from IAY (20 sq. m. minimum).
  verification_status: "OFFICIAL_GOVERNMENT_SCHEME"
  limitations: >-
    PMAY-G norm specifies built (floor) area per household, not total plot area.
    This estimate uses built area as a conservative lower bound for site
    capacity. Actual plot area requirements (including open space, setbacks,
    circulation) would be larger. A site efficiency factor of 0.40 is applied
    (i.e. 40% of total usable area assumed directly habitable, remainder for
    roads, setbacks, and common space) — adjust this factor based on field
    conditions. Capacity is PRELIMINARY only.

# ── Area Standards ────────────────────────────────────────────────────────
# Built floor area per household (m²) — PMAY-G minimum norm.
area_per_household_m2: 25.0

# Area per person (m²) — derived assuming average household size of 4.0 persons.
# Rudraprayag district average household size (Census 2011): ~4.57 persons.
# Conservative value of 4.0 used for planning. Source: Census of India 2011.
area_per_person_m2: 6.25

# Average household size assumption for population capacity estimation.
avg_household_size: 4.0
avg_household_size_note: >-
  Conservative estimate (4.0 persons/HH). Rudraprayag Census 2011 average
  is approximately 4.57. Using 4.0 avoids over-estimating capacity.

# Site efficiency factor: fraction of total usable area directly habitable.
# Accounts for circulation, setbacks, common areas, drainage.
# Typical range for planned rural resettlement: 0.35–0.50.
site_efficiency_factor: 0.40
site_efficiency_note: >-
  40% of total candidate area usable area assumed to be directly habitable
  after accounting for internal roads, setbacks, drainage, and common space.
  This is a conservative planning assumption. Adjust based on site survey.

# Minimum viable plot area (m²). Minimum site area to be considered viable
# for any relocation planning purpose (must accommodate at least 10 households).
minimum_viable_plot_m2: 2500.0
minimum_viable_plot_note: "250 m² usable area minimum (10 HH at 25 m² each)"

# Maximum density (households per hectare).
# Based on PMAY-G norm and site efficiency: 10000 m² * 0.40 / 25 m² = 160 HH/ha
# Upper bound set conservatively at 80 HH/ha (50% reduction for practical density).
max_density_hh_per_ha: 80.0

# ── Output Behaviour ──────────────────────────────────────────────────────
output:
  # Value assigned to capacity_status when standard IS configured
  configured_label: "PRELIMINARY_DWELLING_UNIT_SCENARIO"
  # Value assigned when standard is NOT configured
  not_estimated_label: "NOT_ESTIMATED_REQUIRES_PLANNING_STANDARD"
  planning_standard_name: "PMAY-G 25 m²/HH (MoRD, GoI)"
  planning_note: >-
    Preliminary Spatial Capacity Estimate based on PMAY-G minimum house size
    norm (25 m² per household). Capacity is approximate and subject to field
    validation. Not engineering-certified.
  disclaimer: >-
    PRELIMINARY SPATIAL CAPACITY ESTIMATE — Engineering surveys, geotechnical
    assessment, land ownership verification, and legal clearances are required
    before any site is used for actual relocation planning. This estimate
    applies a site efficiency factor and planning norm that must be validated
    by qualified professionals. NOT an engineering-certified carrying capacity.
